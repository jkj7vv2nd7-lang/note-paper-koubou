<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ノート用紙工房</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root{ --ink:#2e2a23; --paper:#f7f1e3; --card:#fffdf7; --accent:#2e5d46; --accent2:#1f4433; --accentSoft:#e4efe7; --line:#ddd2bd; --muted:#6f6455; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;background:var(--paper);color:var(--ink)}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:21px;color:var(--accent2)}
  header .sub{font-size:12.5px;color:var(--muted);width:100%}
  .headbtn{padding:11px 18px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--accent2)}
  .headbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .layout{display:flex;gap:16px;align-items:flex-start;max-width:1240px;margin:0 auto;padding:14px}
  .panel{width:330px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h2{font-size:14px;color:var(--accent2);margin:14px 0 6px;border-bottom:1px dashed var(--line);padding-bottom:4px}
  .panel h2.gh{background:var(--accentSoft);border-left:5px solid var(--accent);border-bottom:none;border-radius:8px;padding:8px 10px;font-size:14.5px;margin:18px 0 8px}
  .panel h2.gh:first-child{margin-top:0}
  .panel button{min-height:38px}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
  .row label{flex:1;color:#54493a}
  .row input[type=number]{width:64px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .row input[type=text]{flex:1.4;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;min-width:0}
  .row select{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
  .row input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
  .chk{display:flex;align-items:center;gap:7px;font-size:13.5px;margin:7px 0;cursor:pointer;padding:2px 0}
  .chk input{width:19px;height:19px;accent-color:var(--accent)}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .types button{padding:12px 6px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;cursor:pointer;min-height:46px}
  .types button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .bigbtn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:14px;min-height:52px}
  .boardbtn{width:100%;padding:14px;border:none;border-radius:12px;background:#33523f;color:#eef5ee;font-size:16px;font-weight:700;cursor:pointer;margin-top:9px;min-height:50px}
  .subbtn{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;cursor:pointer;margin-top:8px;min-height:44px}
  .stage{flex:1;min-width:0}
  .sheetwrap{background:#e9e2d2;border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto}
  .sheet{background:#fff;margin:0 auto;box-shadow:0 3px 14px rgba(90,70,40,.25)}
  .sheet svg{display:block;width:100%;height:auto}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.7}
  .presetrow{display:flex;gap:6px}
  .presetrow select{flex:1}
  .presetrow button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
  @media (max-width:1080px){ .layout{flex-direction:column} .panel{width:100%} }
  @media screen and (max-width:1080px){ .sheet{width:100% !important;height:auto !important} .sheet svg{width:100% !important;height:auto !important} }
  .board{position:fixed;inset:0;background:#26332b;z-index:100}
  .board.hidden{display:none}
  .boardbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;align-items:center;padding:8px 58px 8px 10px;background:rgba(38,51,43,.96);flex-wrap:wrap;transition:transform .32s ease,opacity .32s ease}
  .board.hideui .boardbar{transform:translateY(-105%);opacity:0;pointer-events:none}
  .boardbar button{padding:9px 12px;border-radius:9px;border:1px solid #4c5f52;background:#33453a;color:#eee;cursor:pointer;font-size:13.5px;min-height:38px}
  .boardbar button.on{background:#e8e4da;color:#222;font-weight:700}
  .boardbar .swatch{width:29px;height:29px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0;cursor:pointer;min-height:0}
  .boardbar .swatch.on{border-color:#fff;box-shadow:0 0 0 2px #999}
  #summonStrip{position:absolute;top:0;left:0;right:0;height:26px;z-index:4}
  #boardExit{position:absolute;top:8px;right:10px;z-index:6;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(20,26,22,.55);color:#fff;font-size:16px;cursor:pointer;opacity:.55}
  #boardExit:hover{opacity:1}
  .boardstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .boardwrap{position:relative;background:#fff;box-shadow:0 4px 30px rgba(0,0,0,.5)}
  .boardwrap svg{display:block}
  #boardCanvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
  #timerDisp{position:absolute;right:12px;bottom:12px;z-index:6;font-family:ui-monospace,monospace;font-size:21px;color:#fff;background:rgba(20,26,22,.55);padding:5px 12px;border-radius:9px;min-width:82px;text-align:center;opacity:.8}
  #timerDisp.done{animation:tblink 0.7s steps(2,start) infinite;opacity:1}
  @keyframes tblink{50%{background:#c0392b;color:#fff}}
  #timerMin{width:54px;padding:6px;border-radius:8px;border:1px solid #4c5f52;background:#33453a;color:#eee;font-size:14px}
  @media print{
    body{background:#fff}
    header,.panel,.note,.noprint{display:none !important}
    .layout{padding:0;max-width:none}
    .sheetwrap{background:#fff;border:none;padding:0;overflow:visible}
    .sheet{box-shadow:none;margin:0}
  }
</style>
</head>
<body>
<header>
  <h1>📐 ノート用紙工房</h1>
  <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
    <button class="headbtn primary" id="headPrint">🖨 印刷する</button>
    <button class="headbtn" id="headBoard">🖥 黒板モード</button>
  </div>
  <div class="sub">小・中・高校の授業で使えるノート用紙を、設定に合わせて実寸で印刷できます。</div>
</header>
<div class="layout">
  <div class="panel" id="panel"></div>
  <div class="stage">
    <div class="sheetwrap"><div class="sheet" id="sheet"></div></div>
    <div class="note noprint">印刷のコツ：印刷画面で「倍率100%（実際のサイズ）」を選び、「なし」以外の拡大縮小をしないでください。用紙の端に付く5cmチェック線で、実寸どおり印刷できたか確かめられます。PDFに保存する場合も、同じ印刷画面から保存できます。</div>
  </div>
</div>
<div id="board" class="board hidden">
  <div class="boardbar">
    <span style="color:#cfd4cc;font-size:13px;font-weight:700">✏️ 黒板モード</span>
    <button class="swatch on" data-color="#222222" style="background:#222222" title="黒"></button>
    <button class="swatch" data-color="#d43a2f" style="background:#d43a2f" title="赤"></button>
    <button class="swatch" data-color="#2266cc" style="background:#2266cc" title="青"></button>
    <button class="swatch" data-color="#2e8b3a" style="background:#2e8b3a" title="緑"></button>
    <span id="chalkSw" style="display:none">
      <button class="swatch" data-color="#ffffff" style="background:#ffffff" title="白（チョーク）"></button>
      <button class="swatch" data-color="#ffe066" style="background:#ffe066" title="黄（チョーク）"></button>
      <button class="swatch" data-color="#ffb3c8" style="background:#ffb3c8" title="ピンク（チョーク）"></button>
      <button class="swatch" data-color="#a8d8ff" style="background:#a8d8ff" title="空色（チョーク）"></button>
    </span>
    <button id="penTypePen" class="on">ペン</button>
    <button id="penTypeMarker">マーカー</button>
    <button data-linestyle="solid" class="on">実線</button>
    <button data-linestyle="dash">破線</button>
    <button data-linestyle="dot">点線</button>
    <label style="color:#cfd4cc;font-size:12.5px">太さ <input type="range" id="penWidthRange" min="1" max="14" step="0.5" value="4.5" style="width:92px;vertical-align:middle"> <span id="penWidthVal">4.5</span></label>
    <button id="eraserBtn">消しゴム</button>
    <button id="undoBtn">1画戻す</button>
    <button id="clearBtn">全消し</button>
    <span style="flex:1"></span>
    <button id="themeBtn">黒板テーマ</button>
    <input type="number" id="timerMin" value="5" min="0" max="180" step="1">
    <span style="color:#cfd4cc;font-size:12px">分</span>
    <button id="timerBtn">タイマー開始</button>
    <button id="saveBoardBtn">💾 書き込みごと保存</button>
    <button id="closeBoardBtn">✕ 終了</button>
  </div>
  <div id="summonStrip" title="ツールバーを表示"></div>
  <button id="boardExit" title="黒板モードを終了">✕</button>
  <span id="timerDisp">5:00</span>
  <div class="boardstage" id="boardStage">
    <div class="boardwrap" id="boardWrap">
      <div id="boardSheet"></div>
      <canvas id="boardCanvas"></canvas>
    </div>
  </div>
</div>
<script>
"use strict";
/* =============== 状態 =============== */
const PAPERS = { A4:[210,297], B5:[182,257], A3:[297,420] };
const S = {
  type:'grid', paper:'A4', orient:'portrait', margin:10, half:false,
  color:'#7f9db9', width:1, titleOn:true, title:'', headerOn:true, instrOn:false, instr:'', calib:true,
  gridCell:5, gridMajor:5,
  xMin:-10, xMax:10, yMin:-10, yMax:10, tick:2, subdiv:5, showNums:true, gridOn:true, xLabel:'x', yLabel:'y',
  ruledSpace:8, ruledMargin:true,
  kanjiSize:15,
  genko:400,
  engH:15, engGap:8,
  staffGap:2.6, staffSpace:12, staffCount:0,
  logMode:'semi', logDecY:3, logDecX:2,
  polarStep:10, polarDeg:15,
  isoStep:5,
  dotStep:5,
  expScope:'full', expDpi:300, expWidthCm:12,
  funcs:[], points:[], segments:[], circles:[], triangles:[], snap:true, nextId:1,
};
const TYPES = [
  ['grid','方眼紙'],['coord','座標グラフ'],['ruled','罫線ノート'],['kanji','漢字マス目'],
  ['genko','原稿用紙'],['english','英語4本線'],['staff','五線紙'],['log','対数グラフ'],
  ['polar','極座標'],['iso','アイソメトリック'],['dot','ドット方眼'],['blank','無地（枠のみ）'],
];
function pageSize(){ const [w,h] = PAPERS[S.paper]; return S.orient==='portrait' ? [w,h] : [h,w]; }
/* =============== SVG部品 =============== */
const NS = 'http://www.w3.org/2000/svg';
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
let INK = '#333';
let CHALK = false;
function line(x1,y1,x2,y2,stroke,w,op,dash){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${w}" ${op!=null?`stroke-opacity="${op}"`:''} ${dash?`stroke-dasharray="${dash}"`:''}/>`; }
function text(x,y,str,size,anchor,fill,bold){ return `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor||'middle'}" fill="${fill||INK}" ${bold?'font-weight="bold"':''} font-family="sans-serif">${esc(str)}</text>`; }
const r2 = n => Math.round(n*100)/100;
/* =============== 各用紙の描画 =============== */
function drawGrid(x0,y0,w,h){
  let s=''; const c=S.gridCell, maj=S.gridMajor*c, col=S.color, wThin=0.18*S.width, wMaj=0.32*S.width;
  for(let x=0;x<=w+0.001;x+=c){ const isMaj = Math.abs(x/maj - Math.round(x/maj))<0.01; s+=line(r2(x0+x),y0,r2(x0+x),y0+h,col,isMaj?wMaj:wThin,isMaj?0.95:0.5); }
  for(let y=0;y<=h+0.001;y+=c){ const isMaj = Math.abs(y/maj - Math.round(y/maj))<0.01; s+=line(x0,r2(y0+y),x0+w,r2(y0+y),col,isMaj?wMaj:wThin,isMaj?0.95:0.5); }
  s+=drawShapesGrid(x0,y0,w,h);
  return s;
}
function drawCoord(x0,y0,w,h){
  let s=''; const {xMin,xMax,yMin,yMax,tick,subdiv} = S;
  const sx = w/(xMax-xMin), sy = h/(yMax-yMin);
  const X = v => x0 + (v-xMin)*sx, Y = v => y0 + (yMax-v)*sy;
  if(S.gridOn){
    const stepX = tick/subdiv, stepY = tick/subdiv;
    for(let v=Math.ceil(xMin/stepX)*stepX; v<=xMax+0.0001; v+=stepX){ const isMaj = Math.abs(v/tick-Math.round(v/tick))<0.01 && Math.abs(v)>0.0001; s+=line(r2(X(v)),y0,r2(X(v)),y0+h,S.color,isMaj?0.3*S.width:0.15*S.width,isMaj?0.9:0.45); }
    for(let v=Math.ceil(yMin/stepY)*stepY; v<=yMax+0.0001; v+=stepY){ const isMaj = Math.abs(v/tick-Math.round(v/tick))<0.01 && Math.abs(v)>0.0001; s+=line(x0,r2(Y(v)),x0+w,r2(Y(v)),S.color,isMaj?0.3*S.width:0.15*S.width,isMaj?0.9:0.45); }
  }
  const axC = CHALK ? '#f2f2ea' : '#333';
  if(yMin<0 && yMax>0) s+=line(x0,r2(Y(0)),x0+w,r2(Y(0)),axC,0.5*S.width);
  if(xMin<0 && xMax>0) s+=line(r2(X(0)),y0,r2(X(0)),y0+h,axC,0.5*S.width);
  s+=`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="${axC}" stroke-width="${0.4*S.width}"/>`;
  if(S.showNums){
    for(let v=Math.ceil(xMin/tick)*tick; v<=xMax; v+=tick){ if(Math.abs(v)<0.0001) continue; s+=text(r2(X(v)), y0+h+4.6, String(Math.round(v*1000)/1000), 3.1); }
    for(let v=Math.ceil(yMin/tick)*tick; v<=yMax; v+=tick){ if(Math.abs(v)<0.0001) continue; s+=text(x0-1.6, r2(Y(v))+1.1, String(Math.round(v*1000)/1000), 3.1, 'end'); }
    s+=text(x0+w-1, y0+h+4.6, '', 3.1);
  }
  if(S.xLabel) s+=text(x0+w, (yMin<0&&yMax>0)? r2(Y(0))-1.6 : y0+h+4.6, S.xLabel, 3.8, 'end', INK, true);
  if(S.yLabel) s+=text((xMin<0&&xMax>0)? r2(X(0))+1.6 : x0+1, y0+3.4, S.yLabel, 3.8, 'start', INK, true);
  s+=text((xMin<0&&xMax>0)? r2(X(0))-1.6 : x0-1.6, (yMin<0&&yMax>0)? r2(Y(0))+4.4 : y0+h+4.6, 'O', 3.1, 'end');
  s+=drawFuncs(X, Y, h);
  s+=drawShapesCoord(X, Y, sx, sy);
  return s;
}
function drawRuled(x0,y0,w,h){
  let s=''; const sp=S.ruledSpace;
  for(let y=sp;y<=h+0.001;y+=sp){ s+=line(x0,r2(y0+y),x0+w,r2(y0+y),S.color,0.25*S.width,0.85); }
  s+=line(x0,y0,x0,y0+h,S.color,0.25*S.width,0.85);
  if(S.ruledMargin) s+=line(x0+18,y0,x0+18,y0+h,'#d66',0.3*S.width,0.8);
  return s;
}
function drawKanji(x0,y0,w,h){
  let s=''; const c=S.kanjiSize, nx=Math.floor(w/c), ny=Math.floor(h/c), ox=x0+(w-nx*c)/2, oy=y0+(h-ny*c)/2;
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){
    const cx=ox+i*c, cy=oy+j*c;
    s+=`<rect x="${r2(cx)}" y="${r2(cy)}" width="${c}" height="${c}" fill="none" stroke="${S.color}" stroke-width="${0.3*S.width}"/>`;
    s+=line(r2(cx+c/2),r2(cy+0.8),r2(cx+c/2),r2(cy+c-0.8),S.color,0.15*S.width,0.55,'1.2 1.2');
    s+=line(r2(cx+0.8),r2(cy+c/2),r2(cx+c-0.8),r2(cy+c/2),S.color,0.15*S.width,0.55,'1.2 1.2');
  }
  return s;
}
function drawGenko(x0,y0,w,h){
  let s=''; const cols = S.genko===400?20:10, rows=20;
  const cw = w/(cols+1), ch = h/rows, ox = x0+cw/2;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    s+=`<rect x="${r2(ox+i*cw)}" y="${r2(y0+j*ch)}" width="${r2(cw)}" height="${r2(ch)}" fill="none" stroke="${S.color}" stroke-width="${0.22*S.width}" stroke-opacity="0.85"/>`;
  }
  const gx = ox + (cols/2)*cw;
  s+=line(r2(gx),y0,r2(gx),y0+h,S.color,0.5*S.width,0.9);
  return s;
}
function drawEnglish(x0,y0,w,h){
  let s=''; const H=S.engH, gap=S.engGap; let y=y0;
  while(y+H<=y0+h+0.001){
    const ys=[y, y+H/3, y+2*H/3, y+H];
    s+=line(x0,r2(ys[0]),x0+w,r2(ys[0]),S.color,0.2*S.width,0.7);
    s+=line(x0,r2(ys[1]),x0+w,r2(ys[1]),S.color,0.15*S.width,0.5,'1.4 1.4');
    s+=line(x0,r2(ys[2]),x0+w,r2(ys[2]),'#c0392b',0.4*S.width,0.95);
    s+=line(x0,r2(ys[3]),x0+w,r2(ys[3]),S.color,0.2*S.width,0.7);
    y += H+gap;
  }
  return s;
}
function drawStaff(x0,y0,w,h){
  let s=''; const g=S.staffGap, block=4*g, step=block+S.staffSpace;
  let n = S.staffCount>0 ? S.staffCount : Math.floor((h+S.staffSpace)/step);
  for(let i=0;i<n;i++){ const yy=y0+i*step; if(yy+block>y0+h+0.001 && S.staffCount===0) break;
    for(let k=0;k<5;k++) s+=line(x0,r2(yy+k*g),x0+w,r2(yy+k*g),CHALK ? '#e8f2e8' : '#444',0.22*S.width,0.9);
  }
  return s;
}
function drawLog(x0,y0,w,h){
  let s=''; const decY=S.logDecY, decX = S.logMode==='loglog'? S.logDecX : 10;
  const logPos = t => Math.log10(t);
  // 横方向
  if(S.logMode==='semi'){
    for(let i=0;i<=decX;i++){ const x=x0+w*i/decX; s+=line(r2(x),y0,r2(x),y0+h,S.color,i%1===0?0.28*S.width:0.15*S.width,0.85); }
  } else {
    const dw=w/decX;
    for(let d=0;d<decX;d++) for(let t=1;t<=10;t++){ const x=x0+d*dw+logPos(t)*dw; s+=line(r2(x),y0,r2(x),y0+h,S.color,t===1?0.3*S.width:0.13*S.width,t===1?0.95:0.5); }
  }
  const dh=h/decY;
  for(let d=0;d<decY;d++) for(let t=1;t<=10;t++){ const y=y0+h-(d*dh+logPos(t)*dh); s+=line(x0,r2(y),x0+w,r2(y),S.color,t===1?0.3*S.width:0.13*S.width,t===1?0.95:0.5); }
  s+=`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="${CHALK ? '#f2f2ea' : '#333'}" stroke-width="${0.4*S.width}"/>`;
  return s;
}
function drawPolar(x0,y0,w,h){
  let s=''; const cx=x0+w/2, cy=y0+h/2, R=Math.min(w,h)/2;
  for(let r=S.polarStep;r<=R+0.001;r+=S.polarStep) s+=`<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(r)}" fill="none" stroke="${S.color}" stroke-width="${0.2*S.width}" stroke-opacity="0.7"/>`;
  for(let a=0;a<360;a+=S.polarDeg){ const rad=a*Math.PI/180; s+=line(r2(cx),r2(cy),r2(cx+R*Math.cos(rad)),r2(cy+R*Math.sin(rad)),S.color,0.15*S.width,0.5); }
  s+=`<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(R)}" fill="none" stroke="${S.color}" stroke-width="${0.3*S.width}"/>`;
  return s;
}
function drawIso(x0,y0,w,h){

function parseExpr(src){
  let s = String(src).replace(/\s+/g, '').toLowerCase()
    .replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, 'pi').replace(/（/g, '(').replace(/）/g, ')').replace(/,/g, '.');
  if(s.startsWith('y=')) s = s.slice(2);

  const peek = () => s[pos];
  function pExpr(){ let n = pTerm(); while(peek() === '+' || peek() === '-'){ const op = s[pos++]; n = { t: op, a: n, b: pTerm() }; } return n; }
  function pTerm(){
    let n = pFactor();
    for(;;){
      const ch = peek();
      if(ch === '*' || ch === '/'){ const op = s[pos++]; n = { t: op, a: n, b: pFactor() }; }
      else if(ch === '(' || (ch >= 'a' && ch <= 'z')){ n = { t: '*', a: n, b: pFactor() }; } // 掛け算の省略
      else break;
    }
    return n;
  }
  function pFactor(){ let n = pUnary(); while(peek() === '^'){ pos++; n = { t: '^', a: n, b: pUnary() }; } return n; }
  function pUnary(){ if(peek() === '-'){ pos++; return { t: 'neg', a: pUnary() }; } if(peek() === '+'){ pos++; return pUnary(); } return pAtom(); }
  function pAtom(){
    const ch = peek();
    if(ch === '('){ pos++; const n = pExpr(); if(peek() !== ')') throw new Error('paren'); pos++; return n; }
    if((ch >= '0' && ch <= '9') || ch === '.'){ const m = /^[0-9]*\.?[0-9]+/.exec(s.slice(pos)); pos += m[0].length; return { t: 'num', v: parseFloat(m[0]) }; }
    if(ch >= 'a' && ch <= 'z'){
      const m = /^[a-z]+/.exec(s.slice(pos))[0]; pos += m.length;
      if(m === 'x') return { t: 'x' };
      if(m === 'pi') return { t: 'num', v: Math.PI };
      if(m === 'e') return { t: 'num', v: Math.E };
      if(['sin','cos','tan','sqrt','abs','log','ln','exp'].includes(m)){
        if(peek() !== '(') throw new Error('fnparen');
        pos++; const a = pExpr(); if(peek() !== ')') throw new Error('paren'); pos++;
        return { t: 'fn', f: m, a };
      }
      throw new Error('name');
    }
    throw new Error('char');

}
function evalAST(n, x){
  switch(n.t){
    case 'num': return n.v;
    case 'x': return x;
    case 'neg': return -evalAST(n.a, x);
    case '+': return evalAST(n.a, x) + evalAST(n.b, x);
    case '-': return evalAST(n.a, x) - evalAST(n.b, x);
    case '*': return evalAST(n.a, x) * evalAST(n.b, x);
    case '/': return evalAST(n.a, x) / evalAST(n.b, x);
    case '^': return Math.pow(evalAST(n.a, x), evalAST(n.b, x));
    case 'fn': { const v = evalAST(n.a, x);
      switch(n.f){
        case 'sin': return Math.sin(v); case 'cos': return Math.cos(v); case 'tan': return Math.tan(v);
        case 'sqrt': return Math.sqrt(v); case 'abs': return Math.abs(v);
        case 'log': return Math.log10(v); case 'ln': return Math.log(v); case 'exp': return Math.exp(v);
      }
    }
  }
  return NaN;
}

function layoutArea(W, H){

function exportSVG(scope){
  const [W, H] = pageSize();
  const inner = buildSheet(0, W, H);
  if(scope === 'full'){
    return { str: `<svg xmlns="${NS}" viewBox="0 0 ${W} ${H}" width="${W}mm" height="${H}mm">${inner}</svg>`, wMm: W, hMm: H };
  }
  const a = layoutArea(W, H);
  const isCoord = S.type === 'coord';
  const padL = isCoord ? 9 : 1, padR = isCoord ? 2 : 1, padT = isCoord ? 4 : 1, padB = isCoord ? 6.5 : 1;
  const vx = r2(a.x0 - padL), vy = r2(a.y0 - padT), vw = r2(a.w + padL + padR), vh = r2(a.h + padT + padB);
  const wMm = Math.max(10, (parseFloat(S.expWidthCm) || 12) * 10);
  const hMm = r2(wMm * vh / vw);
  return { str: `<svg xmlns="${NS}" viewBox="${vx} ${vy} ${vw} ${vh}" width="${wMm}mm" height="${hMm}mm"><rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="#fff"/>${inner}</svg>`, wMm, hMm };
}
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function rasterizePNG(scope){
  const { str, wMm, hMm } = exportSVG(scope);
  const dpi = parseInt(S.expDpi) || 300;
  const pxW = Math.round(wMm / 25.4 * dpi), pxH = Math.round(hMm / 25.4 * dpi);
  const url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });

  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pxW, pxH);
  ctx.drawImage(img, 0, 0, pxW, pxH);
  URL.revokeObjectURL(url);
  return new Promise(res => cv.toBlob(res, 'image/png'));
}
async function doExportPNG(){
  const blob = await rasterizePNG(S.expScope);

}
async function doCopyPNG(){

}

function redrawStrokes(){

  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
  const bwPx = boardCanvas.width, bhPx = boardCanvas.height;
  strokes.forEach(st => {
    applyStrokeStyle(st, bwPx);
    bctx.beginPath();
    st.pts.forEach((p, i) => { const x = p[0] * bwPx, y = p[1] * bhPx; if(i === 0) bctx.moveTo(x, y); else bctx.lineTo(x, y); });
    if(st.pts.length === 1){ const p = st.pts[0]; bctx.lineTo(p[0] * bwPx + 0.5, p[1] * bhPx + 0.5); }
    bctx.stroke();
  });

  const bwPx = boardCanvas.width, bhPx = boardCanvas.height;
  const n = curStroke.pts.length, a = curStroke.pts[n - 2], b = curStroke.pts[n - 1];
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  applyStrokeStyle(curStroke, bwPx);
  bctx.beginPath(); bctx.moveTo(a[0] * bwPx, a[1] * bhPx); bctx.lineTo(b[0] * bwPx, b[1] * bhPx); bctx.stroke();

async function composeBoardPNG(){
  const { str, wMm, hMm } = exportSVG('full');
  const dpi = 300;
  const pxW = Math.round(wMm / 25.4 * dpi), pxH = Math.round(hMm / 25.4 * dpi);
  const url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const cv = document.createElement('canvas'); cv.width = pxW; cv.height = pxH;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pxW, pxH);
  ctx.drawImage(img, 0, 0, pxW, pxH);
  URL.revokeObjectURL(url);
  ctx.drawImage(boardCanvas, 0, 0, pxW, pxH);
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

        const obj = JSON.parse(t);
        const st = obj && obj.settings ? obj.settings : obj;
        if(!st || typeof st !== 'object' || !('type' in st)) throw new Error('bad');
        Object.assign(S, st);
        buildPanel(); render();
        alert('設定を読み込みました');
      } catch(e){ alert('読み込めませんでした。ノート用紙工房の設定JSONファイルを選んでください。'); }
      jsonFile.value = '';
    });
  };
  /* 関数グラフ */
  const fnAdd = document.getElementById('fnAdd');
  if(fnAdd) fnAdd.onclick = () => {
    const inp = document.getElementById('fnInput');
    const expr = inp.value.trim();
    const msg = document.getElementById('fnMsg');
    if(!expr){ msg.textContent = '式を入力してください。'; return; }
    try { parseExpr(expr); } catch(e){ msg.textContent = '式を読み取れませんでした。例：x^2、2x+1、sin(x)、sqrt(x)、abs(x-2)'; return; }
    S.funcs.push({ id: S.nextId++, expr, color: FUNC_COLORS[S.funcs.length % FUNC_COLORS.length], visible: true });
    buildPanel(); render();
  };
  panel.querySelectorAll('[data-fnvis]').forEach(cb => cb.onchange = () => { const f = S.funcs.find(q => q.id == cb.dataset.fnvis); if(f){ f.visible = cb.checked; render(); } });
  panel.querySelectorAll('[data-fndel]').forEach(b => b.onclick = () => { S.funcs = S.funcs.filter(q => q.id != b.dataset.fndel); buildPanel(); render(); });
  /* 点と図形 */
  const bindChkLocal = (id, key) => { const el = document.getElementById(id); if(el) el.onchange = () => { S[key] = el.checked; render(); }; };
  bindChkLocal('snap', 'snap');
  const paper = S.type;
  const snapVal = v => {
    if(!S.snap) return v;
    if(paper === 'coord'){ const st = (parseFloat(S.tick) || 1) / (parseInt(S.subdiv) || 1); return Math.round(v / st) * st; }
    return Math.round(v * 2) / 2;
  };
  const ptAdd = document.getElementById('ptAdd');
  if(ptAdd) ptAdd.onclick = () => {
    let x = parseFloat(document.getElementById('ptX').value), y = parseFloat(document.getElementById('ptY').value);
    if(!isFinite(x) || !isFinite(y)) return;
    x = Math.round(snapVal(x) * 1000) / 1000; y = Math.round(snapVal(y) * 1000) / 1000;
    const label = document.getElementById('ptLabel').value.trim() || nextLabel(paper);
    S.points.push({ id: S.nextId++, paper, x, y, label });
    buildPanel(); render();
  };
  panel.querySelectorAll('[data-ptdel]').forEach(b => b.onclick = () => {
    const id = parseInt(b.dataset.ptdel);
    S.points = S.points.filter(p => p.id !== id);
    S.segments = S.segments.filter(g => g.a !== id && g.b !== id);
    S.circles = S.circles.filter(c => c.c !== id);
    S.triangles = S.triangles.filter(t => t.a !== id && t.b !== id && t.c !== id);
    buildPanel(); render();
  });
  const segAdd = document.getElementById('segAdd');
  if(segAdd) segAdd.onclick = () => { const a = parseInt(document.getElementById('segA').value), b = parseInt(document.getElementById('segB').value); if(a !== b) S.segments.push({ id: S.nextId++, paper, a, b }); buildPanel(); render(); };
  panel.querySelectorAll('[data-segdel]').forEach(b => b.onclick = () => { S.segments = S.segments.filter(g => g.id != b.dataset.segdel); buildPanel(); render(); });
  const cirAdd = document.getElementById('cirAdd');
  if(cirAdd) cirAdd.onclick = () => { const c = parseInt(document.getElementById('cirC').value), r = parseFloat(document.getElementById('cirR').value); if(isFinite(r) && r > 0) S.circles.push({ id: S.nextId++, paper, c, r }); buildPanel(); render(); };
  panel.querySelectorAll('[data-cirdel]').forEach(b => b.onclick = () => { S.circles = S.circles.filter(c => c.id != b.dataset.cirdel); buildPanel(); render(); });
  const triAdd = document.getElementById('triAdd');
  if(triAdd) triAdd.onclick = () => { const a = parseInt(document.getElementById('triA').value), b = parseInt(document.getElementById('triB').value), c = parseInt(document.getElementById('triC').value); if(a !== b && b !== c && a !== c) S.triangles.push({ id: S.nextId++, paper, a, b, c }); buildPanel(); render(); };
  panel.querySelectorAll('[data-tridel]').forEach(b => b.onclick = () => { S.triangles = S.triangles.filter(t => t.id != b.dataset.tridel); buildPanel(); render(); });
  document.getElementById('myPresetSave').onclick = saveMyPreset;
  document.getElementById('myPresetLoad').onclick = loadMyPreset;
  document.getElementById('myPresetDel').onclick = delMyPreset;
}
const PRESETS = {
  p_sho: { type:'grid', gridCell:5, gridMajor:2, color:'#7f9db9', title:'', titleOn:false },
  p_chu: { type:'coord', xMin:-10, xMax:10, yMin:-10, yMax:10, tick:2, subdiv:5, showNums:true, titleOn:true, title:'関数のグラフ' },
  p_kokugo: { type:'kanji', kanjiSize:15, titleOn:true, title:'漢字の練習' },
  p_genko: { type:'genko', genko:400, titleOn:false, headerOn:false },
  p_eigo: { type:'english', engH:15, engGap:8, titleOn:true, title:'English' },
  p_rika: { type:'log', logMode:'loglog', logDecY:3, logDecX:2, titleOn:true, title:'実験データ' },
  p_ongaku: { type:'staff', staffGap:2.6, staffSpace:12, titleOn:false },
};
function applyPreset(){
  const v = document.getElementById('presetSel').value; if(!v) return;
  Object.assign(S, JSON.parse(JSON.stringify(PRESETS[v]))); buildPanel(); render();
}
function myPresets(){ try { return JSON.parse(localStorage.getItem('paper_forge_presets')||'{}'); } catch(e){ return {}; } }
function refreshMyPresets(){
  const selEl = document.getElementById('myPresetSel'); if(!selEl) return;
  const names = Object.keys(myPresets());
  selEl.innerHTML = '<option value="">マイ様式</option>' + names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
}
function saveMyPreset(){
  const name = document.getElementById('myPresetName').value.trim(); if(!name){ alert('名前を入力してください'); return; }
  const all = myPresets(); all[name] = JSON.parse(JSON.stringify(S));
  localStorage.setItem('paper_forge_presets', JSON.stringify(all)); refreshMyPresets(); alert('保存しました');
}
function loadMyPreset(){
  const name = document.getElementById('myPresetSel').value; if(!name) return;
  const p = myPresets()[name]; if(p){ Object.assign(S, p); buildPanel(); render(); }
}
function delMyPreset(){
  const name = document.getElementById('myPresetSel').value; if(!name) return;
  const all = myPresets(); delete all[name];
  localStorage.setItem('paper_forge_presets', JSON.stringify(all)); refreshMyPresets();
}
/* 前回の設定を復元 */
try { const last = JSON.parse(localStorage.getItem('paper_forge_last')||'null'); if(last) Object.assign(S, last); } catch(e){}
setInterval(() => { try { localStorage.setItem('paper_forge_last', JSON.stringify(S)); } catch(e){} }, 1500);
const styleEl = document.createElement('style'); styleEl.id = 'printStyle'; document.head.appendChild(styleEl);
document.getElementById('headPrint').onclick = () => window.print();
document.getElementById('headBoard').onclick = () => openBoard();
buildPanel(); render();
</script>
